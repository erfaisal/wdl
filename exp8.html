<!-- 8. Create a form to display the kinds of food available in a Restaurant. (Use checkboxes wherever necessary) -->
<!DOCTYPE html>
<html>
<head>
    <title>Experiment 8</title>
</head>
<body>
    <h1>Restaurant Food Order Form</h1>

    <form>
        Name: <input type="text" name="name"><br><br>
        Phone: <input type="text" name="phone"><br><br>

        <h3>Select Food Items</h3>
        <input type="checkbox" name="food" value="Pizza"> Pizza<br>
        <input type="checkbox" name="food" value="Burger"> Burger<br>
        <input type="checkbox" name="food" value="Sandwich"> Sandwich<br>
        <input type="checkbox" name="food" value="Noodles"> Noodles<br>
        <input type="checkbox" name="food" value="Biryani"> Biryani<br>

        <h3>Select Drink</h3>
        <input type="checkbox" name="drink" value="Cold Drink"> Cold Drink<br>
        <input type="checkbox" name="drink" value="Juice"> Juice<br>
        <input type="checkbox" name="drink" value="Water"> Water<br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Clear">
    </form>

    <p><a href="index.html">Back to Home</a></p>
</body>
</html>
