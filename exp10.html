<!-- 10. Write a program using CSS to set the background colour, font, and paragraph -->
<!DOCTYPE html>
<html>
<head>
    <title>Experiment 10</title>
    <style>
        body {
            background-color: lightyellow;
            font-family: Arial;
        }
        h1 {
            color: blue;
        }
        p {
            color: green;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Using CSS</h1>
    <p>This is a paragraph with CSS styling.</p>
    <p>CSS is used to set the background colour, font and paragraph style.</p>

    <a href="index.html">Back to Home</a>
</body>
</html>
